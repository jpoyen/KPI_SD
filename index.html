<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ระบบตัวชี้วัดโรคเฉพาะ (Specific Disease Indicators)</title>
<meta name="description" content="ระบบตัวชี้วัดเฉพาะโรคฝ่ายการพยาบาล โรงพยาบาลศิริราช">
<style>
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#1a3c6e}
  #loading{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:14px;background:#1a3c6e;color:#fff;
    font-family:'Segoe UI',Tahoma,sans-serif;transition:opacity .35s ease;z-index:2}
  #loading.hide{opacity:0;pointer-events:none}
  .spinner{width:38px;height:38px;border:4px solid rgba(255,255,255,.25);
    border-top-color:#fff;border-radius:50%;animation:spin .9s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  #loading p{margin:0;font-size:15px;opacity:.9}
  iframe{position:absolute;inset:0;width:100%;height:100%;border:0;z-index:1}
</style>
<script>
  // ยืนยันให้หน้าระบบ (Apps Script) ว่าถูกเปิดผ่านหน้านี้ — ต้องอยู่ก่อน <iframe>
  window.addEventListener('message', function (e) {
    if (!/^https:\/\/[a-z0-9-]+-script\.googleusercontent\.com$/i.test(e.origin)) return;
    if (e.data && e.data.type === 'sdi-hello' && e.source) {
      e.source.postMessage({ type: 'sdi-ok' }, e.origin);
    }
  });
</script>
</head>
<body>
  <div id="loading" role="status" aria-live="polite">
    <div class="spinner"></div>
    <p>กำลังโหลดระบบตัวชี้วัดโรคเฉพาะ...</p>
  </div>

  <script>
    (function () {
      var p = [
      'wBXY942bpR3Yh9zYlhXZvMld',
      'fdkajRlS1YHOZpFd30Sb500X',
      'KNjYBpnbp9meHNkawF3aqtWT',
      'IdjdDFkQSFHZWN2TxQ0UUdET',
      'yFTc2YDNMJjY6J2Y5Z2SB9yc',
      'vM3byNWYt9SbvNmLlx2Zv92Z',
      'uQHcpJ3Yz9yL6MHc0RHa'
      ];
      var f = document.createElement('iframe');
      f.id = 'sdi-app';
      f.title = 'ระบบตัวชี้วัดเฉพาะโรค';
      f.referrerPolicy = 'strict-origin-when-cross-origin';
      f.allow = 'clipboard-write';
      f.onload = function () { document.getElementById('loading').classList.add('hide'); };
      f.src = atob(p.join('').split('').reverse().join(''));
      document.body.appendChild(f);
    })();
  </script>
</body>
</html>
